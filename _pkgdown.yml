url: https://charlescoverdale.github.io/boe/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, reference, news]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/charlescoverdale/boe

reference:
  - title: "Interest Rates"
    desc: "Bank Rate, SONIA, gilt yields, and the full Anderson-Sleath curve"
    contents:
      - boe_bank_rate
      - boe_sonia
      - boe_yield_curve
      - boe_curve

  - title: "Exchange Rates"
    desc: "Sterling spot exchange rates"
    contents:
      - boe_exchange_rate
      - list_exchange_rates

  - title: "Housing & Mortgages"
    desc: "Mortgage rates and approvals"
    contents:
      - boe_mortgage_rates
      - boe_mortgage_approvals

  - title: "Credit & Money"
    desc: "Consumer credit and money supply"
    contents:
      - boe_consumer_credit
      - boe_money_supply

  - title: "Monetary Policy"
    desc: "MPC decisions, voting record, and MPR forecasts"
    contents:
      - boe_mpc_decisions
      - boe_mpc_votes
      - boe_mpr_forecasts

  - title: "Discovery"
    desc: "Search and browse the catalogue of wrapped series"
    contents:
      - boe_search
      - boe_browse
      - boe_series

  - title: "General"
    desc: "Fetch any series by code"
    contents:
      - boe_get

  - title: "Utilities"
    desc: "Cache management and result class"
    contents:
      - clear_cache
      - boe_cache_info
      - print.boe_tbl

  - title: "Package"
    contents:
      - boe-package
